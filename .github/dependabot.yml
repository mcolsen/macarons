version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:17"
      timezone: "Etc/UTC"
    groups:
      opentui:
        patterns:
          - "@opentui/*"
    ignore:
      # The nightly ratchet updates these together with the CLI pin, npm artifact
      # integrity manifest.
      - dependency-name: "@opencode/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:27"
      timezone: "Etc/UTC"
