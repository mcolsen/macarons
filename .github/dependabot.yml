version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:17"
      timezone: "Etc/UTC"
    ignore:
      # The nightly ratchet updates these together with the CLI pin, supported
      # version range, and release checksums.
      - dependency-name: "@opencode-ai/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:27"
      timezone: "Etc/UTC"
