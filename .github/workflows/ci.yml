name: CI

on:
  pull_request:
  # Allows the nightly bump-opencode workflow to run CI on its PR branch:
  # events created with the default GITHUB_TOKEN never trigger pull_request
  # workflows, but workflow_dispatch is exempt from that restriction.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Exceptions are only for reviewed, unreachable code paths. They are
      # advisory- and package-bound, require a rationale, and last at most 30 days.
      - name: Audit dependency lockfile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          today="$(date -u +%F)"
          max_expiry="$(date -u -d "$today + 30 days" +%F)"
          audit_exceptions="$(
            jq -ce --arg today "$today" --arg max_expiry "$max_expiry" '
              def valid_date:
                . as $date
                | try (
                    (($date | type) == "string")
                    and ($date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                    and (
                      ($date + "T00:00:00Z"
                        | fromdateiso8601
                        | strftime("%Y-%m-%d")) == $date
                    )
                  ) catch false;

              def valid_exception:
                . as $exception
                | try (
                    (($exception | type) == "object")
                    and (($exception.id | type) == "string")
                    and ($exception.id
                      | test("^GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}$"))
                    and (($exception.package | type) == "string")
                    and ($exception.package | test("^\\S+$"))
                    and ($exception.expires | valid_date)
                    and (($exception.reason | type) == "string")
                    and (($exception.reason
                      | gsub("^\\s+|\\s+$"; "")
                      | length) >= 20)
                  ) catch false;

              if type != "array" then
                error("audit exceptions must be an array")
              elif any(.[]; valid_exception | not) then
                error("each audit exception needs a GHSA id, package, YYYY-MM-DD expiry, and substantive reason")
              elif ([.[].id] | length) != ([.[].id] | unique | length) then
                error("audit exception IDs must be unique")
              elif ([.[] | select(.expires <= $today) | .id] | length) > 0 then
                error("expired audit exception(s): \([.[] | select(.expires <= $today) | .id] | join(", "))")
              elif ([.[] | select(.expires > $max_expiry) | .id] | length) > 0 then
                error("audit exceptions may last at most 30 days: \([.[] | select(.expires > $max_expiry) | .id] | join(", "))")
              else
                .
              end
            ' .github/audit-exceptions.json
          )"

          package_batches="$(
            env -u GH_TOKEN bun -e '
              const lock = Bun.JSONC.parse(await Bun.file("bun.lock").text())
              if (
                lock === null ||
                typeof lock !== "object" ||
                lock.packages === null ||
                typeof lock.packages !== "object"
              ) {
                throw new Error("bun.lock has no packages map")
              }

              const specs = new Set()
              for (const value of Object.values(lock.packages)) {
                if (!Array.isArray(value) || typeof value[0] !== "string") {
                  throw new Error("bun.lock contains an unreadable package entry")
                }
                const resolved = value[0]
                const separator = resolved.lastIndexOf("@")
                if (separator <= 0) {
                  throw new Error(`Cannot parse resolved package: ${resolved}`)
                }
                const name = resolved.slice(0, separator)
                const version = resolved.slice(separator + 1)
                if (version.startsWith("workspace:")) continue
                if (
                  !/^(@[^/,\s]+\/)?[^@/,\s]+$/.test(name) ||
                  !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)
                ) {
                  throw new Error(`Cannot audit resolved package: ${resolved}`)
                }
                specs.add(`${name}@${version}`)
              }

              const sorted = [...specs].sort()
              if (sorted.length === 0) throw new Error("bun.lock has no registry packages")
              for (let index = 0; index < sorted.length; index += 100) {
                console.log(sorted.slice(index, index + 100).join(","))
              }
            '
          )"
          mapfile -t batches <<<"$package_batches"

          findings='[]'
          for advisory_type in reviewed unreviewed malware; do
            for severity in high critical; do
              for affects in "${batches[@]}"; do
                response="$(
                  gh api --method GET /advisories \
                    -f type="$advisory_type" \
                    -f ecosystem=npm \
                    -f severity="$severity" \
                    -f affects="$affects" \
                    -F is_withdrawn=false \
                    -F per_page=100
                )"
                if ! jq -e --arg advisory_type "$advisory_type" --arg severity "$severity" '
                  type == "array"
                  and length < 100
                  and all(.[];
                    (.ghsa_id | test("^GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}$"))
                    and .type == $advisory_type
                    and .severity == $severity
                    and (.summary | type) == "string"
                    and (.html_url | type) == "string"
                    and (.vulnerabilities | type) == "array"
                  )
                ' <<<"$response" > /dev/null; then
                  echo "::error::GitHub returned an invalid or truncated advisory response."
                  exit 1
                fi
                response="$(
                  jq -ce '[.[] | {
                    id: .ghsa_id,
                    type,
                    severity,
                    summary,
                    url: .html_url,
                    packages: ([.vulnerabilities[]
                      | select(.package.ecosystem == "npm")
                      | .package.name] | unique)
                  }]' <<<"$response"
                )"
                findings="$(
                  jq -ce --argjson response "$response" \
                    '. + $response | unique_by(.id)' <<<"$findings"
                )"
              done
            done
          done

          mapfile -t exceptions < <(jq -c '.[]' <<<"$audit_exceptions")
          for exception in "${exceptions[@]}"; do
            id="$(jq -r '.id' <<<"$exception")"
            package="$(jq -r '.package' <<<"$exception")"
            matches="$(jq -r --arg id "$id" '[.[] | select(.id == $id)] | length' <<<"$findings")"
            if [ "$matches" != "1" ]; then
              echo "::error::Audit exception $id does not match one active high/critical finding."
              exit 1
            fi
            advisory="$(jq -ce --arg id "$id" '.[] | select(.id == $id)' <<<"$findings")"
            if ! jq -e --arg package "$package" \
              '.packages == [$package]' \
              <<<"$advisory" > /dev/null; then
              echo "::error::Audit exception $id does not apply to npm package $package."
              exit 1
            fi
            findings="$(jq -ce --arg id "$id" '[.[] | select(.id != $id)]' <<<"$findings")"
            echo "Exempting $id for $package until $(jq -r '.expires' <<<"$exception")."
          done

          if [ "$(jq -r 'length' <<<"$findings")" -gt 0 ]; then
            echo "::error::Resolved dependencies contain high/critical vulnerabilities:"
            jq -r 'sort_by(.severity, .id)[] | "\(.severity | ascii_upcase) \(.id) [\(.type)]: \(.summary) - \(.url)"' <<<"$findings"
            exit 1
          fi
          echo "No high or critical vulnerabilities found."

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Capped to the runner's core count. Turbo otherwise fans out to its
      # default of 10 concurrent `bun test` processes on a 2-core runner, and
      # six of these packages load .tsx suites: enough simultaneous load-time
      # transpilation to trip an upstream race in Bun's SavedSourceMap — a
      # process-global hash written from transpiler worker threads — which
      # crashes the run outright (SIGILL, fault address 0xFFFFFFFFFFFFFFF8,
      # "Bun has crashed. This indicates a bug in Bun, not your code").
      #
      # It is load-threshold driven, not commit driven, so it reddens whichever
      # branch has grown largest rather than the one that broke something, and
      # it survives reruns once a branch is over the line. The same thrash also
      # times out the tighter waitFor assertions in approve-for-me.
      #
      # Oversubscribing 2 cores 5x buys no throughput on CPU-bound work anyway;
      # this trades little wall time for a far narrower race window.
      #
      # Lowered 2 → 1 on 2026-08-01: the crash returned at the cap of 2, with
      # the same fault address, in the same package (btw), on a merge commit —
      # the documented way a branch inherits the threshold, since merging main
      # grows the tree without any commit here touching the crashing package.
      # Serial is the floor; if it returns again the knob is spent and the fix
      # has to be upgrading the Bun version pinned by the root packageManager or
      # shipping built bundles instead of transpiling source.
      - name: Test
        env:
          TURBO_CONCURRENCY: 1
        run: bun run test

      - name: Build
        run: bun run build

  # Sharded one runner per suite. These ran as a single serial chain until the
  # aggregate hit the 8m job timeout (every test passing, killed mid-cleanup);
  # sharding puts each suite on its own clock instead of a shared budget that
  # any new coverage can exhaust. Each `suite` value must name an `e2e:<suite>`
  # script in tests/e2e/package.json — `bun run e2e:server` still chains them
  # all serially for local runs.
  e2e-server:
    name: Real OpenCode server E2E (${{ matrix.suite }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      # One suite's failure should not mask the rest of the matrix.
      fail-fast: false
      matrix:
        suite:
          - core
          - btw
          - background-tasks
          - bundle
          - concurrency
          - cron
          - subagent-comms
          - redact-secrets
          - scoped-system-prompts
          - web-search
          - install
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned OpenCode version
        run: |
          version="$(cat .opencode-version)"
          test -n "$version"
          echo "OPENCODE_E2E_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      # Shared across shards so the fan-out does not turn one release download
      # into twelve. A miss or a corrupted restore is safe: the harness
      # re-verifies the cached binary against its install-time SHA-256 sidecar
      # and re-downloads on mismatch.
      - name: Cache pinned OpenCode binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/macarons-e2e
          key: macarons-e2e-${{ runner.os }}-${{ env.OPENCODE_E2E_VERSION }}

      - name: Run ${{ matrix.suite }} journey
        run: bun run --cwd tests/e2e e2e:${{ matrix.suite }}

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-shard name: upload-artifact@v4 errors on duplicate names.
          name: opencode-e2e-server-artifacts-${{ matrix.suite }}
          path: artifacts/e2e
          if-no-files-found: ignore

  # This is an upstream dependency contract, not a claim that the unpatched
  # release is fixed. Keep it gating and explicitly pinned until the host fix
  # ships; the normal binary-based suites still test the stock release.
  e2e-background-shutdown:
    name: Background shutdown (patched real host)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCODE_E2E_SOURCE: ${{ github.workspace }}/upstream-opencode
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install plugin dependencies
        run: bun ci

      - name: Check out pinned real host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sst/opencode
          ref: 65cf14df16c191f3e9684f0d9a8bae69103ced6d # v1.18.14
          path: upstream-opencode
          persist-credentials: false

      - name: Install pinned host dependencies without lifecycle scripts
        working-directory: upstream-opencode
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply required upstream lifecycle change
        run: git -C upstream-opencode apply ../tests/e2e/background-tasks/opencode-shutdown.patch

      - name: Check host lifecycle invariants and types
        working-directory: upstream-opencode/packages/opencode
        run: |
          bun test --timeout 30000 test/project/instance.test.ts test/effect/instance-state.test.ts test/project/instance-bootstrap.test.ts test/plugin/loader-shared.test.ts test/cli/tui/thread.test.ts
          bun typecheck

      - name: Exercise normal TUI exit with two cached directories
        run: bun run --cwd tests/e2e e2e:background-tasks:shutdown

      - name: Upload shutdown diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-e2e-background-shutdown-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  # Gating, unlike e2e-tui below: this suite is the only coverage of the
  # standalone (in-process host, serverUrl never bound) transport regression
  # class, and its tmux use is driver-stable — type, Enter, and generous
  # waitForText polls, none of the animation- and keybind-timing the
  # interactive journeys depend on.
  e2e-tui-standalone:
    name: Standalone OpenCode TUI E2E
    needs: e2e-server
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned OpenCode version
        run: |
          version="$(cat .opencode-version)"
          test -n "$version"
          echo "OPENCODE_E2E_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Run standalone TUI journey
        run: bun run --cwd tests/e2e e2e:tui:standalone

      - name: Upload standalone TUI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-e2e-tui-standalone-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  # Gating, like e2e-tui-standalone: the driver-stable persist-permissions and
  # provider-limit journeys use waitForText for positive transitions; Codex's
  # negative assertions use bounded settle windows. None rely on chorded keybinds
  # or sidebar-animation timing, matching the driver profile the standalone job
  # already gates on. This is a SIBLING of the advisory e2e-tui below, not an
  # addition to it: the "do not add must-pass
  # coverage to e2e-tui" rule stands, and the animation/keybind journeys stay
  # advisory there. Adding gating coverage means adding a file to e2e:tui:gating.
  e2e-tui-gating:
    name: Non-animated TUI E2E (gating)
    needs: e2e-server
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned OpenCode version
        run: |
          version="$(cat .opencode-version)"
          test -n "$version"
          echo "OPENCODE_E2E_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Run non-animated TUI journeys
        run: bun run --cwd tests/e2e e2e:tui:gating

      - name: Upload gating TUI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-e2e-tui-gating-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  e2e-tui:
    name: Real OpenCode TUI E2E
    needs: e2e-server
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Advisory on purpose: these are the animation- and chorded-keybind-timing
    # journeys (cache-ratio fade, background-tasks poke, paff ctrl+alt+a, …) that
    # establish their flake budget here. The driver-stable journeys gate in
    # e2e-tui-gating above, and the standalone suite in e2e-tui-standalone; do
    # not add more must-pass coverage to THIS job — add it to e2e:tui:gating.
    continue-on-error: true
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned OpenCode version
        run: |
          version="$(cat .opencode-version)"
          test -n "$version"
          echo "OPENCODE_E2E_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Run TUI journey
        run: bun run e2e:tui

      - name: Upload TUI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-e2e-tui-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
