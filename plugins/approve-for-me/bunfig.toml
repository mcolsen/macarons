# bun test compiles TUI JSX the way the host does: @opentui/solid's preload
# applies the real solid transform (dom-expressions) to workspace .tsx files
# and redirects solid-js's SSR entry to the client build, so rendering-level
# tests (test/tui.test.ts's sidebar_content render cases) exercise genuine
# fine-grained reactivity instead of the inert react-jsx runtime path.
[test]
preload = ["@opentui/solid/preload"]
