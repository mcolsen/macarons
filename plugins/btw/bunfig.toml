# bun test compiles the panel's TUI JSX the way the host does: @opentui/solid's
# preload applies the real solid transform (dom-expressions) to workspace .tsx
# files and redirects solid-js's SSR entry to the client build, so the
# rendering-level tests in test/view.test.tsx exercise genuine fine-grained
# reactivity instead of the inert react-jsx runtime path. The existing
# client/effect tests (tui.test.ts) still pass unchanged — they observe client
# calls and toasts, and dialog.replace's render() stays inside their swallowing
# try/catch.
[test]
preload = ["@opentui/solid/preload"]
